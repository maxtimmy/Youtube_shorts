services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n-runtime
    container_name: n8n_local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678
      NODE_ENV: production
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Moscow}
      TZ: ${N8N_TIMEZONE:-Europe/Moscow}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_ENABLE_EXECUTE_COMMAND: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: child_process,fs,path
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_POOL_SIZE: 1
      EXECUTIONS_TIMEOUT: -1
      N8N_RUNNERS_TASK_TIMEOUT: 604800
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: 604800
      N8N_RUNNERS_MAX_CONCURRENCY: 1
      N8N_RUNNERS_HEARTBEAT_INTERVAL: 180
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - n8n_state:/home/node/.n8n
      - ./input:/work/input
      - ./output:/work/output
      - ./banners:/work/banners:ro
      - ./temp:/work/temp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: auto_shorts_dashboard
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678/api/v1}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_RENDER_WEBHOOK_URL: ${N8N_RENDER_WEBHOOK_URL:-http://n8n:5678/webhook/manual-render-queue}
      N8N_UPLOAD_WEBHOOK_URL: ${N8N_UPLOAD_WEBHOOK_URL:-http://n8n:5678/webhook/manual-youtube-upload}
      N8N_RENDER_WORKFLOW_ID: ${N8N_RENDER_WORKFLOW_ID:-}
      N8N_UPLOAD_WORKFLOW_ID: ${N8N_UPLOAD_WORKFLOW_ID:-}
      YOUTUBE_CREDENTIALS_JSON: ${YOUTUBE_CREDENTIALS_JSON:-[]}
    volumes:
      - ./dashboard:/app:ro
      - ./data:/work/data
      - ./input:/work/input
      - ./output:/work/output
      - ./banners:/work/banners:ro
      - ./temp:/work/temp
      - ./backups:/work/backups
      - ./workflows:/work/workflows
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8787/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  n8n_state:
