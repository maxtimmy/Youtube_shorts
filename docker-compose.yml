services:
  n8n:
    image: node:20-bookworm
    env_file:
      - .env
    container_name: n8n_local
    restart: unless-stopped
    ports:
      - "5678:5678"
    command: ["bash", "/work/temp/bootstrap-n8n.sh"]
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
      - N8N_SECURE_COOKIE=false
      - N8N_ENABLE_EXECUTE_COMMAND=true
      - NODE_FUNCTION_ALLOW_BUILTIN=child_process,fs,path
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - DB_SQLITE_POOL_SIZE=1
      - EXECUTIONS_TIMEOUT=-1
      - N8N_RUNNERS_TASK_TIMEOUT=604800
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=604800
      - N8N_RUNNERS_MAX_CONCURRENCY=1
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=180
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - n8n_state:/home/node/.n8n
      - ./input:/work/input
      - ./output:/work/output
      - ./banners:/work/banners
      - ./temp:/work/temp
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file:
      - .env
    container_name: auto_shorts_dashboard
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./dashboard:/app
      - n8n_state:/work/n8n-data
      - ./data:/work/data
      - ./input:/work/input
      - ./output:/work/output
      - ./banners:/work/banners
      - ./temp:/work/temp
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  n8n_state:
    name: n8n_state
    external: true
